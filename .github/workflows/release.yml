name: Release

on:
  push:
    branches: [release]

permissions:
  contents: read

env:
  VELOCITY_VERSION: 4.0.0
  VELOCITY_BUILD: velocity-4.0.0-6.jar
  VELOCITY_SHA256: 4540289f48c83e305fc2f2c495a84d1f4d0b7f360830251e169dd5a208740e70
  VELOCITY_URL: https://fill-data.papermc.io/v1/objects/4540289f48c83e305fc2f2c495a84d1f4d0b7f360830251e169dd5a208740e70/velocity-4.0.0-6.jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Download and verify Velocity proxy ${{ env.VELOCITY_VERSION }}
        run: |
          curl -fL --retry 3 -o "$VELOCITY_BUILD" "$VELOCITY_URL"
          echo "$VELOCITY_SHA256  $VELOCITY_BUILD" | sha256sum -c -

      - name: Install Velocity proxy into local Maven repository
        run: |
          mvn -B -q install:install-file \
            -Dfile="$VELOCITY_BUILD" \
            -DgroupId=com.velocitypowered \
            -DartifactId=velocity-proxy \
            -Dversion="$VELOCITY_VERSION" \
            -Dpackaging=jar

      - name: Build and test
        run: mvn -B verify

      - name: Stage Velocity plugin
        run: |
          VERSION=$(mvn -B -q -pl protocolize-velocity help:evaluate -Dexpression=project.version -DforceStdout)
          mkdir -p dist
          cp protocolize-velocity/target/protocolize-velocity.jar "dist/protocolize-velocity-$VERSION.jar"

      - name: Upload Velocity plugin
        uses: actions/upload-artifact@v4
        with:
          name: protocolize-velocity
          path: dist/protocolize-velocity-*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Velocity plugin
        uses: actions/download-artifact@v4
        with:
          name: protocolize-velocity
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          JAR=$(ls dist/*.jar)
          VERSION=$(basename "$JAR" | sed -E 's/^protocolize-velocity-(.*)\.jar$/\1/')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" \
              --title "Protocolize Velocity $VERSION" \
              --notes "Built from $GITHUB_SHA with Velocity ${{ env.VELOCITY_VERSION }} on Java 25."
          fi
